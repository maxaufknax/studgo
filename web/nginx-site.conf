# Konfiguration des statischen Containers für studgo.de.
#
# Zwei Aufgaben: die Landing Page ausliefern und die API-Pfade der
# Meldestelle an den studgo-reports-Container weiterreichen - NPM hat dann
# ein einziges Ziel für die Domain, und die App merkt vom Umbau nichts.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Sicherheits-Header - in jedem Block, der selbst `add_header` setzt,
    # erneut eingebunden (siehe security-headers.conf, warum).
    include /etc/nginx/snippets/security-headers.conf;

    # Die echte Absenderadresse. Vor diesem Container steht NPM; was der als
    # `X-Real-IP` mitgibt, ist die Adresse, die er selbst gesehen hat. Nur aus
    # dem Docker-Netz wird ihm geglaubt - ein Kopf, den ein Absender selbst
    # mitschickt, kommt hier nie als Adresse an. Die Meldestelle braucht das
    # für ihre Ratenbremse (bis 1.8.2 las sie den frei setzbaren ersten
    # Eintrag von `X-Forwarded-For`).
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # API der Meldestelle (App-Umgebung) - alles, was der Dienst anbietet.
    location ~ ^/(report|reports|healthz) {
        # Eine Meldung ist ein paar hundert Zeichen lang. Was darüber geht,
        # lehnt nginx ab, bevor es den Dienst erreicht; die App schaltet dann
        # auf die E-Mail-Rückfallebene um, verloren geht nichts.
        client_max_body_size 32k;
        proxy_pass http://studgo-reports:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Alte Impressums-Adresse: die Seite gibt es nicht mehr (privates,
    # nichtkommerzielles Projekt), der Link soll nirgends ins Leere laufen.
    location = /impressum.html {
        return 301 /;
    }

    # Statische Inhalte: Bilder dürfen lange im Cache bleiben, HTML nicht.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
