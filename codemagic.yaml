# Codemagic-Pipeline für StudGo — baut die iOS-App ohne lokalen Mac.
#
# Einmalige Einrichtung in Codemagic (siehe docs/CODEMAGIC.md):
#   1. App-Store-Connect-Schlüssel als Integration anlegen — vorhanden ist
#      bereits "PocketADM ASC key", der für alle Apps des Kontos gilt
#   2. Variablengruppe "studip_oauth" mit STUDIP_CLIENT_ID,
#      STUDIP_CLIENT_SECRET und CERTIFICATE_PRIVATE_KEY_B64
#      (die letzten beiden als "secure" markieren)
#   3. Bundle-ID de.maxaufknax.studgo im Apple Developer Portal registrieren
#      und die App in App Store Connect anlegen

definitions:
  ios_setup: &ios_setup
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      # Der Schlüssel gehört zum Apple-Entwicklerkonto, nicht zu einer App —
      # dieselbe Integration bedient auch PocketADM. Deshalb steht hier
      # dessen Name: Ein Umbenennen in Codemagic würde den anderen Build
      # zerreißen, eine zweite Integration wäre derselbe Schlüssel doppelt.
      app_store_connect: "PocketADM ASC key"
    environment:
      xcode: latest
      # Bewusst **kein** `ios_signing:`-Block: Der holt nur bereits vorhandene
      # Profile und scheitert bei einer neuen App mit "No matching profiles
      # found". Angelegt werden Zertifikat und Profil erst durch
      # `fetch-signing-files --create` im Signaturschritt weiter unten.
      # Dasselbe steht so in PocketADMs Pipeline, die auf diesem Konto läuft.
      vars:
        BUNDLE_ID: "de.maxaufknax.studgo"
        XCODE_SCHEME: "StudGo"
        XCODE_PROJECT: "StudGo.xcodeproj"
      groups:
        # Enthält STUDIP_CLIENT_ID, STUDIP_CLIENT_SECRET **und**
        # CERTIFICATE_PRIVATE_KEY_B64 (alle drei "secure" außer der ID).
        - studip_oauth

  build_scripts: &build_scripts
    - name: Voraussetzungen prüfen
      script: |
        set -eo pipefail
        # Sammelt **alle** fehlenden Angaben auf einmal und meldet sie
        # zusammen. Einzeln geprüft kostet jede vergessene Variable einen
        # eigenen Build-Durchlauf.
        problems=""
        note() { problems="$problems\n  - $1"; }

        [ -n "${STUDIP_CLIENT_ID:-}" ]     || note "STUDIP_CLIENT_ID fehlt — Wert: 15"
        [ -n "${STUDIP_CLIENT_SECRET:-}" ] || note "STUDIP_CLIENT_SECRET fehlt — aus der ZQS-Mail, secure ✅"

        # Zertifikatsschlüssel. Zwei Formen sind erlaubt:
        #   CERTIFICATE_PRIVATE_KEY      — der PEM-Text selbst (bevorzugt)
        #   CERTIFICATE_PRIVATE_KEY_B64  — derselbe Text als base64
        # Der PEM-Text ist die verlässlichere Wahl: Er besteht aus kurzen
        # Zeilen, die beim Kopieren nicht umbrechen, und eine unvollständige
        # Übertragung sieht man sofort an der fehlenden END-Zeile. Die
        # base64-Fassung ist eine einzige Zeile mit über 2000 Zeichen — bricht
        # sie beim Kopieren um oder wird sie abgeschnitten, entsteht daraus
        # klaglos Datenmüll.
        key_source=""
        key_raw=""
        if [ -n "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
          key_source="CERTIFICATE_PRIVATE_KEY"; key_raw="$CERTIFICATE_PRIVATE_KEY"
        elif [ -n "${CERTIFICATE_PRIVATE_KEY_B64:-}" ]; then
          key_source="CERTIFICATE_PRIVATE_KEY_B64"; key_raw="$CERTIFICATE_PRIVATE_KEY_B64"
        fi

        if [ -z "$key_source" ]; then
          note "Zertifikatsschlüssel fehlt — CERTIFICATE_PRIVATE_KEY (PEM-Text) anlegen, secure ✅"
        else
          if printf '%s' "$key_raw" | grep -q -- "-----BEGIN"; then
            printf '%s\n' "$key_raw" > /tmp/cert_key.pem
            echo "Schlüssel aus $key_source: PEM-Text, ${#key_raw} Zeichen."
          else
            printf '%s' "$key_raw" | tr -d '[:space:]' \
              | openssl base64 -d -A -out /tmp/cert_key.pem 2>/dev/null || true
            echo "Schlüssel aus $key_source: base64, ${#key_raw} Zeichen (erwartet ~2272)."
          fi

          # Genau das prüft app-store-connect auch: Der Text muss mit
          # "-----BEGIN " anfangen. Alles andere lehnt es mit "Not a valid
          # certificate private key" ab — sechs Schritte später.
          if ! head -c 11 /tmp/cert_key.pem 2>/dev/null | grep -q -- "-----BEGIN"; then
            note "Der Zertifikatsschlüssel ergibt keinen PEM-Text (beginnt nicht mit '-----BEGIN')."
            note "  → Wert ist vermutlich abgeschnitten. Besser CERTIFICATE_PRIVATE_KEY"
            note "    mit dem PEM-Text belegen: cat .secrets/cert_key.pem"
          elif ! openssl rsa -in /tmp/cert_key.pem -noout -check >/dev/null 2>&1 \
               && ! openssl pkey -in /tmp/cert_key.pem -noout >/dev/null 2>&1; then
            note "PEM erkannt, aber es ist kein lesbarer RSA-Schlüssel — unvollständig übertragen?"
          else
            echo "✓ Zertifikatsschlüssel gelesen ($(head -1 /tmp/cert_key.pem))."
          fi
        fi

        if [ -n "$problems" ]; then
          echo "!! Codemagic → Applications → StudGo → Environment variables,"
          echo "!! Gruppe 'studip_oauth':"
          printf "%b\n" "$problems"
          exit 1
        fi
        echo "✓ Alle Voraussetzungen erfüllt."

        # Rein informativ: Ohne App-Datensatz in App Store Connect scheitert
        # erst der Upload ganz am Ende. Schlägt der Aufruf fehl, ist das kein
        # Grund abzubrechen — dann sagt eben der Upload Bescheid.
        if app-store-connect apps list > /tmp/asc_apps.json 2>/dev/null; then
          if grep -q "$BUNDLE_ID" /tmp/asc_apps.json; then
            echo "✓ App-Datensatz für $BUNDLE_ID gefunden."
          else
            echo "!! Achtung: In App Store Connect gibt es keine App mit der"
            echo "!! Bundle-ID $BUNDLE_ID. Der Build läuft durch, aber der"
            echo "!! Upload am Ende wird scheitern. Jetzt anlegen lohnt sich."
          fi
        fi

    - name: XcodeGen bereitstellen
      script: |
        # Die meisten Images bringen XcodeGen mit; falls nicht, nachinstallieren.
        which xcodegen || brew install xcodegen
        xcodegen --version

    - name: Build-Nummer bestimmen
      script: |
        set -e
        NEW_BUILD="${BUILD_NUMBER:-1}"
        if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            NEW_BUILD=$((LATEST + 1))
          fi
        fi
        echo "Build-Nummer: $NEW_BUILD"
        echo "STUDGO_BUILD_NUMBER=$NEW_BUILD" >> "$CM_ENV"

    - name: Secrets und Build-Nummer in xcconfig schreiben
      script: |
        set -e
        # Die Datei liegt bewusst nicht im Repo — sie entsteht hier aus den
        # verschlüsselten Codemagic-Variablen.
        mkdir -p Config
        cat > Config/Secrets.xcconfig <<XCCONFIG
        STUDIP_CLIENT_ID = ${STUDIP_CLIENT_ID}
        STUDIP_CLIENT_SECRET = ${STUDIP_CLIENT_SECRET}
        CURRENT_PROJECT_VERSION = ${STUDGO_BUILD_NUMBER}
        XCCONFIG
        # Kontrolle ohne das Secret zu protokollieren
        grep -v CLIENT_SECRET Config/Secrets.xcconfig

    - name: Xcode-Projekt erzeugen
      script: |
        set -e
        xcodegen generate
        test -d "$XCODE_PROJECT"

    - name: Prüfen, dass die Secrets am Ziel ankommen
      script: |
        set -eo pipefail
        # Beweist, dass Config/Secrets.xcconfig wirklich am Target hängt.
        # Tut sie das nicht, bleibt $(STUDIP_CLIENT_ID) im Info.plist leer und
        # CFBundleVersion auf 1 stehen: Die App baut, lädt hoch — und scheitert
        # dann auf dem Gerät bei der Anmeldung, während der zweite Upload an
        # der doppelten Build-Nummer hängenbleibt. Beides ohne jede Warnung.
        set +e
        xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
          -configuration Release -showBuildSettings > /tmp/buildsettings.txt 2>/dev/null
        rc=$?
        set -e
        if [ $rc -ne 0 ]; then
          echo "!! Build-Einstellungen nicht auslesbar — Prüfung übersprungen."
        else
          CLIENT_ID=$(awk -F' = ' '/ STUDIP_CLIENT_ID = /{print $2; exit}' /tmp/buildsettings.txt)
          BUILD_NO=$(awk -F' = ' '/ CURRENT_PROJECT_VERSION = /{print $2; exit}' /tmp/buildsettings.txt)
          echo "STUDIP_CLIENT_ID        = ${CLIENT_ID:-<leer>}"
          echo "CURRENT_PROJECT_VERSION = ${BUILD_NO:-<leer>}"
          if [ -z "$CLIENT_ID" ]; then
            # Zwei sehr verschiedene Ursachen, die sich an der Build-Nummer
            # auseinanderhalten lassen: Steht dort nicht die 1 aus
            # project.yml, ist die xcconfig eingebunden und nur der Wert leer.
            if [ -n "$BUILD_NO" ] && [ "$BUILD_NO" != "1" ]; then
              echo "!! Die xcconfig hängt am Target (CURRENT_PROJECT_VERSION = $BUILD_NO),"
              echo "!! aber STUDIP_CLIENT_ID ist leer — die Variable fehlt in Codemagic."
              echo "!! Applications → StudGo → Environment variables → studip_oauth"
            else
              echo "!! Weder client_id noch Build-Nummer kommen an: Config/Secrets.xcconfig"
              echo "!! hängt nicht am Target. In project.yml gehört das unter"
              echo "!! 'configFiles:', nicht unter 'settings.configs.<Name>.xcconfig'."
            fi
            exit 1
          fi
        fi

    - name: Signatur einrichten (Zertifikat und Profil anlegen)
      script: |
        set -eo pipefail
        # Apples API kann ein Verteilzertifikat anlegen, den zugehörigen
        # **privaten Schlüssel gibt sie niemals heraus** — der muss von hier
        # kommen. Fehlt er, bricht der Schritt mit "Cannot save Signing
        # Certificates without certificate private key" ab und legt weder
        # Zertifikat noch Profil an.
        #
        # Derselbe Schlüssel bei jedem Lauf ist Absicht: Apple begrenzt die
        # Zahl der Verteilzertifikate je Konto. Ein frisch erzeugter Schlüssel
        # verbrauchte bei jedem Build einen weiteren Platz.
        # Identisch zum ersten Schritt — siehe dort zu den beiden Formen.
        key_raw="${CERTIFICATE_PRIVATE_KEY:-${CERTIFICATE_PRIVATE_KEY_B64:-}}"
        if printf '%s' "$key_raw" | grep -q -- "-----BEGIN"; then
          printf '%s\n' "$key_raw" > /tmp/cert_key.pem
        else
          printf '%s' "$key_raw" | tr -d '[:space:]' \
            | openssl base64 -d -A -out /tmp/cert_key.pem
        fi

        keychain initialize
        app-store-connect fetch-signing-files "$BUNDLE_ID" \
          --type IOS_APP_STORE \
          --certificate-key @file:/tmp/cert_key.pem \
          --create
        keychain add-certificates
        # Muss nach xcodegen laufen, sonst gibt es kein Projekt zum Anpassen.
        xcode-project use-profiles

    - name: IPA bauen
      script: |
        # Kein `set -e`: Bei einem Fehlschlag soll erst das Log ausgewertet
        # werden. `build-ipa` meldet sonst nur "exited with status 1", und der
        # eigentliche Fehler steckt in einer Datei, die niemand zu sehen bekommt.
        set +e
        xcode-project build-ipa \
          --project "$XCODE_PROJECT" \
          --scheme "$XCODE_SCHEME"
        status=$?
        if [ $status -ne 0 ]; then
          echo "═══════ build-ipa fehlgeschlagen (exit $status) — Xcode-Fehler unten ═══════"
          log=$(ls -t /tmp/xcodebuild_logs/*.log 2>/dev/null | head -n1)
          if [ -n "$log" ]; then
            echo ">> Logdatei: $log"
            echo "───────── Fehler- und Signaturzeilen ─────────"
            grep -nE "error:|fatal error|The following build commands failed|Signing for|requires a provisioning|No profile|no matching|certificate|does not support|deployment target|Undefined symbol|linker command failed" "$log" | tail -n 100
            echo "───────── letzte 200 Logzeilen ─────────"
            tail -n 200 "$log"
          else
            echo "!! kein Xcode-Log unter /tmp/xcodebuild_logs gefunden"
          fi
          exit $status
        fi

  build_artifacts: &build_artifacts
    - build/ios/ipa/*.ipa
    - /tmp/xcodebuild_logs/*.log
    - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

workflows:
  # Läuft bei jedem Push und prüft nur, ob die App überhaupt baut — ohne
  # Signatur, ohne Upload. Bewusst ohne Integrationen und ohne
  # Variablengruppen, damit dieser Workflow sofort startet, während die
  # Apple-Einrichtung noch aussteht.
  check:
    name: 1 · Build-Prüfung (ohne Apple-Konto)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: "StudGo"
        XCODE_PROJECT: "StudGo.xcodeproj"
    triggering:
      events:
        - push
        - pull_request
    scripts:
      - name: Syntaxprüfung der Swift-Quellen
        script: |
          # Läuft in Sekunden und bricht ab, bevor eine halbe Xcode-Bauzeit
          # für eine vergessene Klammer draufgeht.
          python3 tools/swift-sanity.py App

      - name: XcodeGen bereitstellen
        script: which xcodegen || brew install xcodegen
      - name: Platzhalter-Secrets schreiben
        script: |
          # Nur zum Kompilieren — echte Werte kommen ausschließlich im
          # testflight-Workflow aus den verschlüsselten Variablen.
          mkdir -p Config
          cat > Config/Secrets.xcconfig <<XCCONFIG
          STUDIP_CLIENT_ID = 0
          STUDIP_CLIENT_SECRET =
          CURRENT_PROJECT_VERSION = ${BUILD_NUMBER:-1}
          XCCONFIG
      - name: Projekt erzeugen und für den Simulator bauen
        script: |
          set -eo pipefail
          xcodegen generate
          mkdir -p build/logs
          # xcbeautify macht die Ausgabe lesbar, das Rohlog bleibt als
          # Artefakt erhalten. pipefail sorgt dafür, dass ein Baufehler
          # nicht vom Formatierer verschluckt wird.
          FORMATTER=cat
          command -v xcbeautify >/dev/null && FORMATTER=xcbeautify
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination "generic/platform=iOS Simulator" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/logs/xcodebuild.log | $FORMATTER

      - name: Warnungen zusammenfassen
        script: |
          # Läuft auch nach einem Fehlschlag nicht ins Leere: der Schritt
          # meldet immer Erfolg, er berichtet nur.
          grep -E "warning:" build/logs/xcodebuild.log \
            | sed 's|/Users/builder/clone/||' | sort -u | head -60 \
            || echo "Keine Warnungen."
    artifacts:
      - build/logs/*.log

  testflight:
    name: 2 · TestFlight (Apple-Einrichtung nötig)
    <<: *ios_setup
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts: *build_scripts
    artifacts: *build_artifacts
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Erst nach dem ersten erfolgreichen Upload befüllen, sonst schlägt
        # die Verteilung fehl, weil die Gruppe noch nicht existiert.
        # beta_groups:
        #   - Interne Tester
      email:
        recipients:
          - maximilian.elias.paasch@gmail.com
        notify:
          success: true
          failure: true
