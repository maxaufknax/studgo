# XcodeGen-Beschreibung — erzeugt StudGo.xcodeproj, damit keine binäre
# Projektdatei im Repo liegt: ./tools/bootstrap-secrets.sh && xcodegen generate
name: StudGo
options:
  bundleIdPrefix: com.maxpaasch
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    # SWIFT_VERSION kennt nur Sprachmodi (5.0 / 6.0), keine Punktversionen.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  StudGo:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StudGo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Erspart bei jedem Upload die Frage nach der Exportkontrolle:
        # StudGo nutzt ausschließlich HTTPS des Systems.
        ITSAppUsesNonExemptEncryption: false
        STUDIP_CLIENT_ID: $(STUDIP_CLIENT_ID)
        STUDIP_CLIENT_SECRET: $(STUDIP_CLIENT_SECRET)
        CFBundleURLTypes:
          - CFBundleURLName: com.maxpaasch.studgo.oauth
            CFBundleURLSchemes: [studgo]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxpaasch.studgo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        # Enthält client_id, client_secret und die Build-Nummer.
        # Wird von tools/bootstrap-secrets.sh bzw. von Codemagic erzeugt.
        Debug:
          xcconfig: Config/Secrets.xcconfig
        Release:
          xcconfig: Config/Secrets.xcconfig
