# Sicherheits-Header der Landing Page - als eigene Datei, weil nginx sie
# **nicht vererbt**: Sobald ein `location`-Block selbst ein `add_header`
# setzt (etwa Cache-Control), gelten die Header des `server`-Blocks dort
# nicht mehr. Bis 1.8.2 kam auf studgo.de deshalb kein einziger davon an.
# Jeder Block, der `add_header` benutzt, bindet diese Datei mit ein.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
