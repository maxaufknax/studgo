# XcodeGen-Beschreibung — erzeugt StudGo.xcodeproj, damit keine binäre
# Projektdatei im Repo liegt: ./tools/bootstrap-secrets.sh && xcodegen generate
name: StudGo
options:
  bundleIdPrefix: de.maxaufknax
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    # SWIFT_VERSION kennt nur Sprachmodi (5.0 / 6.0), keine Punktversionen.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  StudGo:
    type: application
    platform: iOS
    sources:
      - path: App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StudGo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Alle vier, obwohl die App fürs Hochformat auf dem iPhone gedacht ist.
        # Seit iOS 26 laufen auch reine iPhone-Apps auf iPad und Mac in frei
        # veränderbaren Fenstern; Apples Upload-Prüfung lehnt eine
        # eingeschränkte Liste deshalb mit Fehler 90474 ab. Auf iPhones mit
        # Face ID benutzt das System das Kopfüber-Format ohnehin nie, und quer
        # ist der Stundenplan sogar besser lesbar.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Erspart bei jedem Upload die Frage nach der Exportkontrolle:
        # StudGo nutzt ausschließlich HTTPS des Systems.
        ITSAppUsesNonExemptEncryption: false
        STUDIP_CLIENT_ID: $(STUDIP_CLIENT_ID)
        STUDIP_CLIENT_SECRET: $(STUDIP_CLIENT_SECRET)
        CFBundleURLTypes:
          - CFBundleURLName: de.maxaufknax.studgo.oauth
            CFBundleURLSchemes: [studgo]
    # Enthält client_id, client_secret und die Build-Nummer; erzeugt von
    # tools/bootstrap-secrets.sh bzw. von Codemagic.
    #
    # Muss `configFiles` heißen. Unter `settings.configs.<Name>.xcconfig`
    # notiert — was naheliegt — legt XcodeGen stattdessen stumm eine
    # Build-Einstellung namens "xcconfig" an: Die Datei wird dann nie
    # eingebunden, $(STUDIP_CLIENT_ID) im Info.plist bleibt leer und die
    # Anmeldung schlägt zur Laufzeit fehl, ohne dass der Build etwas merkt.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.maxaufknax.studgo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
