# XcodeGen-Beschreibung - erzeugt StudGo.xcodeproj, damit keine binäre
# Projektdatei im Repo liegt: ./tools/bootstrap-secrets.sh && xcodegen generate
name: StudGo
options:
  bundleIdPrefix: de.maxaufknax
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

settings:
  base:
    # SWIFT_VERSION kennt nur Sprachmodi (5.0 / 6.0), keine Punktversionen.
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.8.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  StudGo:
    type: application
    platform: iOS
    sources:
      - path: App
    # Die Widgets laufen im eigenen Prozess und lesen ihren Stand über die
    # App-Group - dieselbe Gruppe braucht deshalb auch die App (siehe
    # `WidgetSnapshotStore`).
    entitlements:
      path: App/StudGo.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.maxaufknax.studgo.shared
    # Bindet die Widget-Erweiterung ein und bettet sie in die App.
    dependencies:
      - target: StudGoWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: StudGo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        UILaunchScreen:
          UIColorName: LaunchBackground
        # Alle vier, obwohl die App fürs Hochformat auf dem iPhone gedacht ist.
        # Seit iOS 26 laufen auch reine iPhone-Apps auf iPad und Mac in frei
        # veränderbaren Fenstern; Apples Upload-Prüfung lehnt eine
        # eingeschränkte Liste deshalb mit Fehler 90474 ab. Auf iPhones mit
        # Face ID benutzt das System das Kopfüber-Format ohnehin nie, und quer
        # ist der Stundenplan sogar besser lesbar.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Erspart bei jedem Upload die Frage nach der Exportkontrolle:
        # StudGo nutzt ausschließlich HTTPS des Systems.
        ITSAppUsesNonExemptEncryption: false
        # Ohne diese beiden Einträge wirft `BGTaskScheduler.register` zur
        # Laufzeit; die Kennung muss wortgleich zu `Notifications.refreshTaskID`
        # sein. `fetch` allein genügt - StudGo braucht kein `processing`, der
        # Lauf ist nach drei Anfragen fertig.
        BGTaskSchedulerPermittedIdentifiers:
          - de.maxaufknax.studgo.refresh
        UIBackgroundModes:
          - fetch
        # Der Abgleich mit dem iOS-Kalender (seit 1.8.2). Fehlt der Text,
        # beendet iOS die App in dem Moment, in dem sie nach dem Zugriff
        # fragt. Ab iOS 17 gilt der erste Schlüssel, davor der zweite; die
        # englische Fassung steht in App/Resources/en.lproj/InfoPlist.strings.
        NSCalendarsFullAccessUsageDescription: "StudGo trägt deinen Stundenplan in einen eigenen Kalender „StudGo“ ein und hält ihn aktuell. Deine übrigen Termine liest StudGo nicht."
        NSCalendarsUsageDescription: "StudGo trägt deinen Stundenplan in einen eigenen Kalender „StudGo“ ein und hält ihn aktuell. Deine übrigen Termine liest StudGo nicht."
        STUDIP_CLIENT_ID: $(STUDIP_CLIENT_ID)
        CFBundleURLTypes:
          - CFBundleURLName: de.maxaufknax.studgo.oauth
            CFBundleURLSchemes: [studgo]
    # Enthält client_id und die Build-Nummer; erzeugt von
    # tools/bootstrap-secrets.sh bzw. von Codemagic.
    #
    # Muss `configFiles` heißen. Unter `settings.configs.<Name>.xcconfig`
    # notiert - was naheliegt - legt XcodeGen stattdessen stumm eine
    # Build-Einstellung namens "xcconfig" an: Die Datei wird dann nie
    # eingebunden, $(STUDIP_CLIENT_ID) im Info.plist bleibt leer und die
    # Anmeldung schlägt zur Laufzeit fehl, ohne dass der Build etwas merkt.
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.maxaufknax.studgo
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Die Widget-Erweiterung: nächster Termin und ungelesene Nachrichten auf
  # dem Sperrbildschirm. Sie teilt sich genau eine Datei mit der App -
  # `App/Core/WidgetSnapshot.swift`, den kodierbaren Schnappschuss - und
  # liest ihn über die App-Group, statt selbst beim Server zu fragen.
  StudGoWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: App/Core/WidgetSnapshot.swift
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: StudGo Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: de
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/StudGoWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.de.maxaufknax.studgo.shared
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.maxaufknax.studgo.widgets
        # Erweiterungen werden nie allein ausgeliefert - SKIP_INSTALL hält
        # sie aus dem Produktarchiv heraus. Ein eigenes App-Icon braucht
        # nur die App; die Widgets erben ihr Aussehen vom System.
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
