# Konfiguration des statischen Containers für studgo.de.
#
# Zwei Aufgaben: die Landing Page ausliefern und die API-Pfade der
# Meldestelle an den studgo-reports-Container weiterreichen — NPM hat dann
# ein einziges Ziel für die Domain, und die App merkt vom Umbau nichts.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Statische Seite: keine Riesenstatistik, aber ein paar Grund Header.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'" always;

    gzip on;
    gzip_comp_level 5;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # API der Meldestelle (App-Umgebung) — alles, was der Dienst anbietet.
    location ~ ^/(report|reports|healthz) {
        proxy_pass http://studgo-reports:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Statische Inhalte: Bilder dürfen lange im Cache bleiben, HTML nicht.
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
